name: npm

# Manual package publishing. The first publish of each package is done locally
# with 2FA; after that, configure npm trusted publishing for this workflow on
# the package settings page (repo rushlightlab/kinglet, environment release).
#
# Fallback auth: set NPM_TOKEN as a release-environment secret (granular token
# scoped to @kinglet with read/write). Never commit a token or .npmrc secret.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - "@kinglet/mcp"
          - "@kinglet/sdk-node"
      tag:
        description: npm dist-tag (use next for prereleases)
        required: false
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck

      - name: Publish
        run: >
          pnpm --filter "${{ inputs.package }}" publish
          --access public
          --tag "${{ inputs.tag }}"
          --provenance
          --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
