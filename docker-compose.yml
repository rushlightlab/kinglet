services:
  kinglet:
    build: .
    image: kinglet:latest
    ports:
      # Bind to localhost when a TLS proxy (Caddy/nginx) fronts the app:
      #   "127.0.0.1:8080:3000"
      - "8080:3000"
    env_file:
      - path: .env
        required: false
    environment:
      KINGLET_DB_PATH: /data/kinglet.db
      KINGLET_RETENTION_DAYS: 14
      # Public HTTPS URL — required for secure cookies and correct alert links:
      # KINGLET_BASE_URL: https://logs.example.com
      # KINGLET_ADMIN_EMAIL: you@example.com
      # KINGLET_ADMIN_PASSWORD: change-me-please
      # BETTER_AUTH_SECRET: <32+ random bytes; a persisted secret is generated in /data otherwise>
    volumes:
      - kinglet-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kinglet-data:
