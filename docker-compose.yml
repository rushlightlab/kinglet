services:
  kinglet:
    build: .
    # Prefer the published image? Comment out `build:` and use:
    # image: ghcr.io/your-org/kinglet:latest   (or pin a version, e.g. :0.1.0)
    image: kinglet:latest
    ports:
      - "8080:3000"
    environment:
      KINGLET_DB_PATH: /data/kinglet.db
      KINGLET_RETENTION_DAYS: 14
      # Prefer fixed tokens over the auto-generated one? Uncomment:
      # KINGLET_TOKENS: tok_change_me
    volumes:
      - kinglet-data:/data
    restart: unless-stopped

volumes:
  kinglet-data:
